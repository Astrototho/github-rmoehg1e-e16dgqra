<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#022354" />
    <title>Hors connexion — PerfConnect</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f9fafb;
        color: #022354; /* marine du logo (navy-900) */
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      /* Logo complet : jamais moins de 120 px de large, zone de protection
         ≥ x (diamètre d'une tête, ≈ 19 px à cette taille). */
      img {
        display: block;
        width: 160px;
        height: auto;
        margin: 0 auto 32px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #6b7280;
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #cd3c00; /* brand-600 : AA avec texte blanc */
        color: #fff;
        font: inherit;
        font-weight: 700;
        padding: 14px 24px;
        min-height: 48px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-wordmark-480.png" alt="PerfConnect" width="160" height="101" />
      <h1>Pas de connexion internet</h1>
      <p>Vérifie ton réseau puis réessaie. Tes sorties et tes messages s'afficheront dès que tu seras de nouveau en ligne.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
      // Rechargement automatique au retour du réseau.
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
